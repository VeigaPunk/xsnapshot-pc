# ~/.tmux.conf — tuned for long-running agent fleets (omp swarms, tower workers).
#
#   * Prefix follows the host's existing setup: C-Space, with C-b kept as prefix2
#     (evidence: ~/.config/tmux/tmux.conf binds exactly that).
#   * Panes hold long-lived agents: huge scrollback, every pane labelled in its
#     border, window/pane numbers that never shift under you.
#   * Wayland-first: no X11 utilities assumed — clipboard leaves via OSC 52,
#     with wl-copy used only when it is actually installed.
#   * Reload after editing: prefix r  (see bindings at the bottom).
#
# NOTE ON PRECEDENCE: tmux reads $XDG_CONFIG_HOME/tmux/tmux.conf (on this host
# ~/.config/tmux/tmux.conf) INSTEAD of ~/.tmux.conf whenever that file exists.
# While it does, this file is inert — add `source-file -q ~/.tmux.conf` there to
# pick these settings up. ~/.local/bin/omp-swarm does not depend on it: it sets
# the pane-border labels, stable window names and remain-on-exit on its own
# swarm window, so fleets stay legible under either config.

# --------------------------------------------------------------------- prefix
set -g prefix C-Space
set -g prefix2 C-b
bind C-Space send-prefix

# ------------------------------------------------------------------- terminal
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"
set -g allow-passthrough on

# Keep TUI agents responsive: a large escape-time makes Esc feel broken in
# node TUIs (omp, kimi, codex all bind Esc).
set -s escape-time 10
set -g focus-events on
set -g set-titles on
set -g set-titles-string "#S:#I.#P #W"

# Kitty-style extended keys, as the host's own config already relies on.
set -g extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features "xterm-kitty:extkeys"

# ---------------------------------------------------------------------- mouse
set -g mouse on
set -g set-clipboard on

# ------------------------------------------------------------------ scrollback
# Applies to panes created after this line is read; existing panes keep theirs.
set -g history-limit 100000

# ------------------------------------------------- stable window/pane naming
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows off      # closing window 2 must not renumber 3..n
setw -g automatic-rename off     # window names stay as set, not as the tty runs
set -g allow-rename off          # programs inside a pane may not rename it
setw -g window-size latest       # size to the most recent client, not smallest

# ------------------------------------------------------- pane-border labels
setw -g pane-border-status top
setw -g pane-border-format " #I.#P #[fg=colour250,bold]#{pane_title}#[default] · #{pane_current_command}#{?pane_dead, · #[fg=red]DEAD#[default],}#{?pane_in_mode, · #[fg=yellow]COPY#[default],}#{?pane_synchronized, · #[fg=magenta]SYNC#[default],} "
setw -g pane-border-indicators colour
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour39,bold"

# ------------------------------------------------------------------ alerts
# Fleet-friendly: no popups, no beeps — the status line flags busy windows.
setw -g monitor-activity on
set -g visual-activity off
set -g activity-action none
setw -g monitor-bell on
set -g visual-bell off
set -g bell-action other
setw -g window-status-activity-style "fg=colour214,bold"

# ---------------------------------------------------------------- status line
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=colour234,fg=colour250"
set -g status-left-length 48
set -g status-right-length 120
set -g status-left "#[fg=colour234,bg=colour39,bold] #S #[bg=colour234,fg=colour39]#{?client_prefix,#[fg=colour214]⌘ ,#[fg=colour238],}#[default] "
set -g status-right "#[fg=colour245]#H#[fg=colour238] | #[fg=colour245]#(cut -d' ' -f1-3 /proc/loadavg 2>/dev/null || echo '- - -')#[fg=colour238] | #[fg=colour250]%Y-%m-%d %H:%M "
setw -g window-status-format " #I:#W#{?window_activity_flag,*,}#{?window_bell_flag,!,}#{?window_zoomed_flag,Z,} "
setw -g window-status-current-format "#[fg=colour234,bg=colour39,bold] #I:#W#{?window_zoomed_flag, Z ,}#[bg=colour234,fg=colour39]#[default] "
setw -g window-status-separator ""
set -g message-style "bg=colour39,fg=colour234,bold"
set -g message-command-style "bg=colour234,fg=colour39"

# ------------------------------------------------------------------- messages
set -g display-time 2000
set -g display-panes-time 4000

# With several clients on one session, keep the client attached instead of
# dumping it back to a shell when the last window closes.
set -g detach-on-destroy off

# --------------------------------------------------------------------- copy
setw -g mode-keys vi
setw -g mode-style "bg=colour39,fg=colour234"
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line
# Wayland: prefer wl-copy when present, else let OSC 52 (set-clipboard) carry it.
if-shell "command -v wl-copy >/dev/null 2>&1" \
  "bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'wl-copy'; \
   bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel 'wl-copy'" \
  "bind -T copy-mode-vi y send -X copy-pipe-and-cancel; \
   bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel"

# -------------------------------------------------------------- key bindings
bind r source-file ~/.tmux.conf \; display-message "reloaded ~/.tmux.conf"

# splits and new windows inherit the current path (swarm panes must not land in $HOME)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# vim-style pane movement and resizing
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# fleet operations
bind R respawn-pane -k \; display-message "pane respawned"
bind S setw synchronize-panes \; display-message "synchronize-panes #{?synchronize-panes,on,off}"
bind B if -F "#{==:#{pane-border-status},off}" \
  "setw pane-border-status top; display-message 'pane borders on'" \
  "setw pane-border-status off; display-message 'pane borders off'"
bind C-z resize-pane -Z \; display-message "zoom #{?window_zoomed_flag,on,off}"
