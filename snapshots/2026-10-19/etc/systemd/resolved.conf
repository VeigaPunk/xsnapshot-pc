[Resolve]
# Some examples of DNS servers which may be used for DNS= and FallbackDNS=:
# Cloudflare: <ip>#one.one.one.one <ip>#one.one.one.one <ipv6>#one.one.one.one <ipv6>#one.one.one.one
# Google:     <ip>#dns.google <ip>#dns.google <ipv6>#dns.google <ipv6>#dns.google
# Quad9:      <ip>#dns.quad9.net <ip>#dns.quad9.net <ipv6>#dns.quad9.net <ipv6>#dns.quad9.net
#
# Using DNS= configures global DNS servers and does not suppress link-specific
# configuration. Parallel requests will be sent to per-link DNS servers
# configured automatically by systemd-networkd.service(8), NetworkManager(8), or
# similar management services, or configured manually via resolvectl(1). See
# resolved.conf(5) and systemd-resolved(8) for more details.
#DNS=
#FallbackDNS=<ip>#dns.quad9.net <ipv6>#dns.quad9.net <ip>#cloudflare-dns.com <ipv6>#cloudflare-dns.com <ip>#dns.google <ipv6>#dns.google
#Domains=
#DNSSEC=no
#DNSOverTLS=no
#MulticastDNS=yes
#LLMNR=yes
#Cache=yes
#CacheFromLocalhost=no
#DNSCacheSize=4096
#MulticastDNSCacheSize=4096
#LLMNRCacheSize=4096
#DNSStubListener=yes
#DNSStubListenerExtra=
#ReadEtcHosts=yes
#ReadStaticRecords=yes
#ResolveUnicastSingleLabel=no
#StaleRetentionSec=0
#RefuseRecordTypes=
